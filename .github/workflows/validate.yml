name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          for f in custom_components/floorplan_studio/frontend/*.js; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs; done
      - name: Wall geometry tests
        run: node tests/walls.test.mjs
      - name: Feature tests
        run: node tests/features.test.mjs
